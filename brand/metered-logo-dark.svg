<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 248 64" role="img" aria-label="Metered logo (dark background)">
  <defs>
    <linearGradient id="metered-blue-d" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4D8DFF"/>
      <stop offset="1" stop-color="#00C2FF"/>
    </linearGradient>
  </defs>
  <!-- meter gauge mark: 270° arc, gap at bottom, needle at ~ -30° -->
  <g stroke="url(#metered-blue-d)" fill="none" stroke-linecap="round">
    <path d="M 15.03 48.97 A 24 24 0 1 1 48.97 48.97" stroke-width="7"/>
    <!-- gauge ticks -->
    <path d="M 15.03 48.97 L 19.27 44.73" stroke-width="3"/>
    <path d="M 32 8 L 32 14" stroke-width="3"/>
    <path d="M 48.97 48.97 L 44.73 44.73" stroke-width="3"/>
    <!-- needle -->
    <path d="M 32 32 L 49.3 22" stroke-width="4"/>
  </g>
  <circle cx="32" cy="32" r="4" fill="#4D8DFF"/>
  <!-- wordmark -->
  <text x="70" y="42" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="700" letter-spacing="-1" fill="#F5F7FA">metered</text>
</svg>
